<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- 平板四周留 1.25pt 空隙，让电脑线框在平板后面断开 -->
    <mask id="knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="18">
      <rect width="18" height="18" fill="#fff"/>
      <rect x="9.25" y="5.25" width="9.5" height="12.5" rx="2.75" fill="#000"/>
    </mask>
  </defs>
  <!-- 电脑：线框 -->
  <rect x="1.75" y="2.25" width="11.5" height="8" rx="1.75" fill="none" stroke="#000" stroke-width="1.5" mask="url(#knockout)"/>
  <!-- 电脑：底座 -->
  <rect x="5.25" y="12.25" width="4" height="1.5" rx="0.75" fill="#000" mask="url(#knockout)"/>
  <!-- 平板：实心 -->
  <rect x="10.5" y="6.5" width="7" height="10" rx="1.5" fill="#000"/>
</svg>
